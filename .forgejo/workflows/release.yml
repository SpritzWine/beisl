# Release pipeline (Codeberg / Forgejo Actions).
#
# Trigger: pushing a tag `v*` whose version matches Cargo.toml. Builds both
# workspaces once and attaches to a Codeberg release for the tag:
#   beisl-<v>-<arch>.tar.gz       the bundle `beisl install` runs from
#   beisl-<v>.tar.gz              the source, as distro recipes expect it
#   beisl-<v>-vendor.tar.zst      every dependency, for a build with no network
#   SHA256SUMS
# The last two are what packaging/ builds from (see packaging/README.md).
#
# One-time repo setup on Codeberg:
#   1. Settings → Units → enable Actions.
#   2. Settings → Actions → Secrets → add RELEASE_TOKEN: an access token with
#      repository write scope (user settings → Applications). The automatic
#      Actions token cannot create releases, hence the explicit secret.
#
# Cut a release with:
#   packaging/bump-version.sh 0.1.0 "<one sentence>"   # every place the version lives
#   git commit, then: git tag v0.1.0 && git push origin v0.1.0
#
# Prereleases follow SemVer: a hyphen in the version (v0.1.0-alpha.1, v1.0.0-rc.2,
# with Cargo.toml carrying the same version) marks the Codeberg release as
# pre-release automatically — no switch to forget.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # Self-hosted runner (ci/runner/), NOT a Codeberg hosted one.
    #
    # Codeberg's hosted runners cap a job at 2/5/10 minutes (tiny/small/medium);
    # `-lazy` only delays when a job STARTS (it may sit in the queue for up to 24h),
    # it does not extend the runtime. That misreading is what silently killed the
    # v0.1.0 release build: ~630 crates (libcosmic/wgpu) with thin LTO cannot compile
    # in 10 minutes on 4 cores, and no cache fixes that -- the cold build has to fit
    # in the cap at least once, and it never can.
    #
    # The self-hosted runner has no cap and keeps CARGO_HOME + both target dirs on a
    # bind-mounted cache disk, so only the first release build is cold.
    runs-on: beisl-local
    # Official Rust image: toolchain + gcc/make preinstalled. One build-time system
    # lib on top: libcosmic's "wayland" feature (Frosted Glass, 0.2.0) compiles
    # smithay-client-toolkit, whose build script pkg-config-requires xkbcommon —
    # installed in the build step below. Everything else still dlopens at runtime.
    container:
      image: docker.io/library/rust:1
    env:
      # /cache is bind-mounted into every job container by the runner (see
      # ci/runner/data/config.template.yml). The Makefile takes CLI_TARGET/GUI_TARGET.
      CARGO_HOME: /cache/cargo
      CLI_TARGET: /cache/target-cli
      GUI_TARGET: /cache/target-gui
    steps:
      # No actions at all in this job: the runner executes actions (and their nested
      # steps) inside the job container, and bare rust:1 has no node — which rules out
      # actions/checkout and even composite actions nesting a Node step. Everything
      # here is plain git/make/curl instead.
      - name: Checkout
        run: |
          url="$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY"
          git init -q .
          git fetch -q --depth 1 "$url" "$FORGEJO_SHA" || git fetch -q --depth 1 "$url" "$FORGEJO_REF"
          git checkout -q FETCH_HEAD

      - name: Tag matches Cargo.toml
        # The Makefile names the bundle after Cargo.toml's version; a mismatched
        # tag would publish a tarball that contradicts its release page.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$FORGEJO_REF_NAME" ]; then
            echo "tag $FORGEJO_REF_NAME does not match Cargo.toml v$version" >&2
            exit 1
          fi

      - name: Release notes for this tag
        # RELEASENOTES.md is the full history, newest first, one `# beisl <version>`
        # section per release. Posting the whole file would put every past release's
        # notes on this release's page, so slice out just this version's section:
        # from its heading up to the next one. The heading itself is dropped -- the
        # release page already carries the tag as its title.
        #
        # Runs BEFORE the build, so a missing section fails in seconds instead of
        # after a full compile (same reason the tag check sits up here).
        run: |
          version=${FORGEJO_REF_NAME#v}
          awk -v v="$version" '
            $0 == "# beisl " v { found = 1; next }   # our section starts
            found && /^# beisl /  { exit }           # next release: stop
            found                 { print }
          ' RELEASENOTES.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "no '# beisl $version' section in RELEASENOTES.md" >&2
            exit 1
          fi
          echo "release notes ($(wc -l < /tmp/release-notes.md) lines):"
          cat /tmp/release-notes.md

      - name: Build and package
        # libxkbcommon-dev: see the container comment up top (sctk build script).
        # zstd packs the vendor tarball; desktop-file-utils and appstream are what
        # `make check-packaging` validates the desktop entries and metainfo with.
        run: |
          apt-get -qq update && apt-get -qq install -y --no-install-recommends \
            libxkbcommon-dev zstd desktop-file-utils appstream >/dev/null
          make
          make check-packaging

      - name: Source and vendor tarballs
        # What a distro builds from with no network (packaging/README.md): the
        # source at this tag, and every dependency of both cargo workspaces.
        run: make sdist vendor

      - name: Collect release assets
        # dist/ also holds the unpacked bundle tree, so stage only what is
        # published, plus checksums.
        run: |
          mkdir -p dist/release
          mv dist/beisl-*.tar.gz dist/beisl-*-vendor.tar.zst dist/release/
          cd dist/release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        # Straight Forgejo API, no action: forgejo-release is composite bash, but it
        # nests an actions/cache step (Node), and the runner prepares nested actions
        # inside the job container — the same "no node in rust:1" wall as checkout.
        # Creating a release and attaching assets is two curl calls anyway.
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          # Token hygiene, verified by crashing this script on purpose in a local
          # container and grepping for a canary token: the token reaches curl via a
          # header *file* (never a command line, so no ps/xtrace exposure), -sf keeps
          # curl from echoing bodies/headers on errors, and the two lines that do
          # expand the token swallow their own xtrace (the 2>/dev/null) so even a
          # stray `bash -x` cannot print it.
          { test -n "${RELEASE_TOKEN:-}"; } 2>/dev/null \
            || { echo "RELEASE_TOKEN secret is not set" >&2; exit 1; }
          api="$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY"
          hdr=$(mktemp)
          { printf 'Authorization: token %s\n' "$RELEASE_TOKEN" > "$hdr"; } 2>/dev/null
          # SemVer: a hyphenated version is a prerelease.
          case "$FORGEJO_REF_NAME" in *-*) pre=true ;; *) pre=false ;; esac
          # This tag's section of RELEASENOTES.md, sliced out by the earlier step (the
          # whole file is the full history — posting it would repeat every past
          # release's notes on this page). jq does the JSON escaping (the rust image
          # lacks it — same self-install the upstream release action does).
          command -v jq >/dev/null || { apt-get -qq update && apt-get -qq install -y jq; } >/dev/null 2>&1
          notes=$(cat /tmp/release-notes.md)
          payload=$(jq -n --arg tag "$FORGEJO_REF_NAME" --arg body "$notes" --argjson pre "$pre" \
                    '{tag_name:$tag, name:$tag, prerelease:$pre, body:$body}')
          # Create the release for the tag — or, on a re-run, reuse the existing one.
          # The `|| true` keeps set -e from killing the step at curl so the
          # diagnostic below is what lands in the log.
          resp=$(curl -sf -X POST "$api/releases" -H @"$hdr" \
                   -H "Content-Type: application/json" \
                   -d "$payload" \
                 || curl -sf "$api/releases/tags/$FORGEJO_REF_NAME" -H @"$hdr" || true)
          id=$(printf '%s' "$resp" | grep -o '"id":[0-9]*' | head -n1 | cut -d: -f2)
          test -n "$id" \
            || { echo "could not create or find the release for $FORGEJO_REF_NAME (bad/missing token scope, or API unreachable)" >&2; exit 1; }
          for f in dist/release/*; do
            curl -sf -X POST "$api/releases/$id/assets?name=$(basename "$f")" \
              -H @"$hdr" -F "attachment=@$f" -o /dev/null \
              || { echo "failed to attach $(basename "$f") to release $id" >&2; exit 1; }
            echo "attached: $(basename "$f")"
          done
          rm -f "$hdr"
          echo "release $FORGEJO_REF_NAME published (prerelease=$pre)"
