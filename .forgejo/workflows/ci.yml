# CI (Codeberg / Forgejo Actions): the main workspace's fmt/clippy/test on every
# push and PR. Cheap by design — 26 crates, minutes from cold — so it fits the
# regular runner slots. The beisl-gui workspace is deliberately NOT checked here:
# its ~630-crate libcosmic tree needs the lazy lane and is exercised by the
# release pipeline instead (and locally, per CLAUDE.md, when the GUI changes).

name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: codeberg-small
    container:
      image: docker.io/library/rust:1
    steps:
      # Not actions/checkout: that's a Node action, and the runner executes actions
      # inside the job container — bare rust:1 has no node. For a public repo a
      # checkout is three lines of git (with a ref fallback for PR merge SHAs).
      - name: Checkout
        run: |
          url="$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY"
          git init -q .
          git fetch -q --depth 1 "$url" "$FORGEJO_SHA" || git fetch -q --depth 1 "$url" "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
      - name: fmt
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace
