[workspace]
resolver = "2"
members = [
    "crates/assets",          # embedded data payloads (icons, udev/tmpfiles bodies)
    "crates/beisl",           # the wrapper binary (`beisl %command%`)
    "crates/preflight",       # setup checks (perf/llvm/paranoid/mangohud) + pkexec fixes
    "crates/session",         # live session state shared with the session window
    "crates/symbol-resolver", # perf.data addresses -> wine symbols (tiered fidelity)
    "crates/artifact",        # the merged, exportable trace (frametimes ⋈ samples)
    "crates/compat",          # compat-wall signatures shared by the wrapper and beisl-mcp
    "crates/beisl-mcp",       # MCP server binary over the trace library (opt-in, stdio)
    "crates/docs-gen",        # docs/*.1.md -> man pages (packaging tool; runtime binaries
                              #   embed the same files for --help — single source of truth)
]

# beisl-gui is a standalone workspace (its own lockfile): the heavy libcosmic/wgpu tree
# stays out of the light CLI/lib build. Built separately via crates/beisl-gui.
exclude = ["crates/beisl-gui"]

[workspace.package]
authors = ["Florian Schaupp"]
version = "0.4.0"
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://codeberg.org/SpritzWine/beisl"

[profile.release]
# Beisl ships bundled with SpritzWine; keep it small.
opt-level = "s"
lto = true
strip = true
