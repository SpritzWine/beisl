[package]
name = "session"
description = "Live trace-session state shared between the beisl wrapper and its session window"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Small JSON state file bridges the (light) CLI writer and the (libcosmic) window reader.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
