[package]
name = "artifact"
description = "The Beisl trace artifact: frametime side-channel ⋈ symbolicated perf samples, with per-layer CPU shares, a timeline, and a rendered report"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Self-contained JSON container: human-readable, GUI-parseable, MCP-native, and small
# because we store the aggregated top symbols (not raw samples). serde is already in the
# workspace via `session`. A binary/rusqlite container can come later if size demands it.
#
# `session` is a dependency so `persist()` can name artifact.json/report.txt from
# `session::library`'s constants, not a second driftable copy. No cycle: `session` itself
# depends only on serde, and both consumers of this crate already depend on it directly.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symbol-resolver = { path = "../symbol-resolver" }
session = { path = "../session" }
compat = { path = "../compat" }   # the run's compat walls and driver-load attempts
