[package]
name = "artifact"
description = "The Beisl trace artifact: frametime side-channel ⋈ symbolicated perf samples, with per-layer CPU shares, a timeline, and a rendered report"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Self-contained JSON container: human-readable, GUI-parseable, MCP-native, and small
# because we store the aggregated top symbols (not raw samples). serde is already in the
# workspace via `session`. A binary/rusqlite container can come later if size demands it.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symbol-resolver = { path = "../symbol-resolver" }
