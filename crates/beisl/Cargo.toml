[package]
name = "beisl"
description = "Perf-tracing wrapper: drives MangoHud + perf around a game, emits a symbolicated trace"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "beisl"
path = "src/main.rs"

# Mostly std-only for now. Deps we'll pull in as the layers land: clap (arg parsing),
# anyhow (errors), notify (mangohud-log file-watch), artifact (once the post-run step
# is wired).
[dependencies]
assets = { path = "../assets" }
preflight = { path = "../preflight" }
session = { path = "../session" }
compat = { path = "../compat" }     # live compat-wall warnings in the session window
artifact = { path = "../artifact" }   # post-run: resolve + merge -> artifact.json + report.txt
libc = "0.2"        # PR_SET_PDEATHSIG so perf dies with us (no orphaned recorder)
