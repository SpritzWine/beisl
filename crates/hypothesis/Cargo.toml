[package]
name = "hypothesis"
description = "A likely cause for each frametime spike, from readable rules and from what the user has labelled - always beside the measurement, never instead of it"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# std + serde only: the learners are a few hundred lines of arithmetic, not a dependency.
# `session` for the one XDG data root the traces live under.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
session = { path = "../session" }
