# Beisl — widen the i915 per-card GPU "error" node so the "render" group can read the
# GPU crash state without root. Companion to /etc/udev/rules.d/99-beisl-gpu-dump.rules
# (the udev rule covers hotplug + the dynamic devcoredump; this covers cards already
# present at boot). Re-applied on every boot by systemd-tmpfiles-setup, and immediately
# by `systemd-tmpfiles --create` at install time.
#
# Type "z" adjusts mode + ownership of the (glob-)matching existing paths, non-recursive.
# Only i915 cards have an "error" attribute, so the glob naturally skips amdgpu cards.
#
# HONEST CAVEAT: this is a chmod/chgrp of a sysfs attribute. It holds at runtime and is
# re-applied each boot, but it is NOT durable across a driver unbind/rebind that recreates
# the attribute mid-session (the udev "change" rule above re-covers the hotplug path).
z /sys/class/drm/card[0-9]*/error 0640 root render - -
