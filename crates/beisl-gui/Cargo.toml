# Beisl setup + trace GUI (libcosmic / COSMIC look).
#
# Standalone crate with its OWN workspace + lockfile, excluded from the main Beisl
# workspace so the heavy libcosmic/winit/wgpu tree never touches the light CLI/lib build
# (mirrors the SpritzWine installer's split). Same pinned libcosmic rev + feature set as
# the installer, a known-good windowed-app baseline.
[package]
name = "beisl-gui"
# Deliberately not a real version: as a separate workspace this manifest can't inherit
# `[workspace.package]` from the root Cargo.toml, and a literal here would just drift.
# The one Beisl version lives in the root manifest; the binary reports it via
# `preflight::VERSION` (see `beisl-setup --version`).
authors = ["Florian Schaupp"]
version = "0.1.0"
edition = "2021"
description = "Beisl setup + trace GUI (COSMIC look)"
license = "LGPL-2.1-or-later"
publish = false

[[bin]]
name = "beisl-setup"
path = "src/main.rs"

# The compat-finding review window: a second front-end over gamebus-setup's compat
# flow (scan, draft, mark reported), sharing this workspace's libcosmic build.
[[bin]]
name = "beisl-compat"
path = "src/compat/main.rs"

[dependencies]
preflight = { path = "../preflight" }
session = { path = "../session" }
# The results view binds to the exact same artifact the CLI produces — one analysis code
# path, two front-ends (the window does no analysis of its own; it renders `TraceArtifact`
# and runs `TraceArtifact::build` for the "Analyze" action). Pulls in symbol-resolver +
# serde_json, both light; the heavy tree here is still only libcosmic.
artifact = { path = "../artifact" }
# beisl-compat: the wrapper's wording for each wall, and the stash file as loose JSON.
compat = { path = "../compat" }
serde_json = "1"
plotters-backend = "0.3"
plotters = { version = "0.3", default-features = false, features = ["all_series", "all_elements"] }
# BitFlags<Auto>::empty() for the Frosted Glass allow-mask (Core::set_auto_blur) — libcosmic
# doesn't re-export enumflags2, so this is a direct dep; pinned to the same version libcosmic
# itself pins, so it resolves to the one copy already in the tree.
enumflags2 = "0.7.12"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# libcosmic master 2026-09-04: 52 commits past the previous pin (0eef5911,
# 2026-07-17), still no new release tag since COSMIC 1.3 (Frosted Glass). The
# whole range was read before moving: nothing renames or drops the
# widget/text/settings APIs used here, Core::set_auto_blur and BitFlags<Auto>
# are untouched, Text became SelectableText without an API break (8a03f063),
# and the iced submodule only picked up wayland/dnd/scrolling fixes. Pin
# mirrors the SpritzWine installer's again: the two had silently drifted 88
# commits apart, and both were moved here in one pass (2026-09-05).
rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498"
default-features = false
# "wayland" compiles iced-winit's Wayland layer incl. the ext-background-effect
# handler — without it Frosted Glass can't render on ANY compositor (found 2026-07-19:
# distro COSMIC apps frosted under KWin while beisl-setup stayed opaque).
features = ["dbus-config", "tokio", "winit", "wgpu", "wayland"]

# Own workspace root -> own Cargo.lock, kept out of the main Beisl lockfile.
[workspace]

# Separate workspace, so it doesn't inherit the main Beisl release profile — give it a
# lean one of its own (Beisl ships bundled; keep the GUI small). thin LTO keeps the
# libcosmic release build tractable while still stripping the debuginfo bulk.
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
