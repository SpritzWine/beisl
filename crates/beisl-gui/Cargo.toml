# Beisl setup + trace GUI (libcosmic / COSMIC look).
#
# Standalone crate with its OWN workspace + lockfile, excluded from the main Beisl
# workspace so the heavy libcosmic/winit/wgpu tree never touches the light CLI/lib build
# (mirrors the SpritzWine installer's split). The libcosmic pin and feature set track
# the installer's as a known-good windowed-app baseline; the rev comment below says
# where the two currently stand.
[package]
name = "beisl-gui"
# Deliberately not a real version: as a separate workspace this manifest can't inherit
# `[workspace.package]` from the root Cargo.toml, and a literal here would just drift.
# The one Beisl version lives in the root manifest; the binary reports it via
# `preflight::VERSION` (see `beisl-setup --version`).
authors = ["Florian Schaupp"]
version = "0.1.0"
edition = "2021"
description = "Beisl setup + trace GUI (COSMIC look)"
license = "LGPL-2.1-or-later"
publish = false

[[bin]]
name = "beisl-setup"
path = "src/main.rs"

# The compat-finding review window: a second front-end over gamebus-setup's compat
# flow (scan, draft, mark reported), sharing this workspace's libcosmic build.
[[bin]]
name = "beisl-compat"
path = "src/compat/main.rs"

[dependencies]
preflight = { path = "../preflight" }
# Embedded icons. beisl-setup reaches them through preflight; beisl-compat needs the
# details-pane glyph directly, because a named icon is theme-dependent and Breeze has
# no sidebar-show-right-symbolic.
assets = { path = "../assets" }
session = { path = "../session" }
# The results view binds to the exact same artifact the CLI produces — one analysis code
# path, two front-ends (the window does no analysis of its own; it renders `TraceArtifact`
# and runs `TraceArtifact::build` for the "Analyze" action). Pulls in symbol-resolver +
# serde_json, both light; the heavy tree here is still only libcosmic.
artifact = { path = "../artifact" }
# beisl-compat: the wrapper's wording for each wall.
compat = { path = "../compat" }
serde_json = "1"
# The records, judgements and verbs gamebus-setup's front-ends share, so this window
# holds no second copy of them. serde-only by design: linking it brings no IO, no
# network and no SQL into a binary that submits nothing.
#
# Pinned by rev, like libcosmic below: a tag can be moved, a rev cannot, and the
# lockfile pinning is what keeps this workspace out of a poisoned release. This rev is
# gamebus-presenced v0.5.0. github rather than the gitea remote, which is a LAN-only
# address that would make this workspace unbuildable for anyone else.
#
# The coupler's build.rs compiles gamedb's stores.toml in, so the build needs that
# submodule; cargo checks out submodules for a git dependency, which a vendored copy or
# a bare path checkout would not.
gamebus-coupler = { git = "https://github.com/fschaupp/gamebus-presenced.git", rev = "132cb5980aca261754ed51ca7786e0e68a630934" }
# The client key that identifies this window to gamebus. Signing only: the key is
# generated from /dev/urandom rather than pulling a rand stack, and hex is a handful of
# lines here rather than another crate. Pinned, and audited on both sides of the change.
# 3.0 is the RustCrypto generation move (curve25519-dalek 5, signature 3, sha2 0.11):
# same SigningKey/Signer/Verifier surface, same wire format, no rand_core feature.
ed25519-dalek = "3.0.0"
plotters-backend = "0.3"
plotters = { version = "0.3", default-features = false, features = ["all_series", "all_elements"] }
# BitFlags<Auto>::empty() for the Frosted Glass allow-mask (Core::set_auto_blur) — libcosmic
# doesn't re-export enumflags2, so this is a direct dep; pinned to the same version libcosmic
# itself pins, so it resolves to the one copy already in the tree.
enumflags2 = "0.7.12"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# libcosmic master 2026-10-09: 48 commits past the previous pin (d4d71fd5,
# 2026-09-04), still no release tag since COSMIC 1.3 (Frosted Glass). HEAD is a
# docs-only commit on top of the 10-07 fix cluster, so it is a quiet point to
# take. The whole range was read before moving: the feature names,
# Core::set_auto_blur and BitFlags<Auto> are untouched and enumflags2 stays at
# 0.7.12; the widgets used here (text, settings::section/item, button, toggler,
# icon) keep their signatures, but ListItem/container/toggler styling and the
# text_input selection colours changed (60ad2cc4, d880804b, f6be7b5f, ff7c7533),
# so the settings pages want a look on screen. The iced submodule moved 19
# commits (pop-os winit to rev 9567503 for touch window moves, accesskit bump,
# Wayland popup-modifier and layer-surface keyboard fixes); the
# ext-background-effect handler is unchanged. cctk moved to cosmic-protocols
# c0cff4d (session-lock protocol, MIT relicense). Moved in the 2026-10-10
# dependency pass for beisl only: the SpritzWine installer still sits on
# d4d71fd5 and has to be moved separately to restore the shared baseline.
rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4"
default-features = false
# "wayland" compiles iced-winit's Wayland layer incl. the ext-background-effect
# handler — without it Frosted Glass can't render on ANY compositor (found 2026-07-19:
# distro COSMIC apps frosted under KWin while beisl-setup stayed opaque).
features = ["dbus-config", "tokio", "winit", "wgpu", "wayland"]

# Own workspace root -> own Cargo.lock, kept out of the main Beisl lockfile.
[workspace]

# Separate workspace, so it doesn't inherit the main Beisl release profile — give it a
# lean one of its own (Beisl ships bundled; keep the GUI small). thin LTO keeps the
# libcosmic release build tractable while still stripping the debuginfo bulk.
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
